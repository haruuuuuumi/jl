<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin sign-in — Jeolee Cupids</title><link rel="icon" href="/assets/favicon.svg">
<style>
@font-face{font-family:DM Sans;src:url('/assets/dm-sans-400.ttf')}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#101012;color:#faf7f9;font-family:'DM Sans',sans-serif}main{width:min(100%,400px)}.brand{color:#f576b5;text-decoration:none;font-weight:700;font-size:24px;letter-spacing:-1px}h1{font-size:36px;letter-spacing:-1.5px;margin:42px 0 10px}p{color:#bdb5bc;line-height:1.6}label{display:block;margin:28px 0 10px;font-size:14px}input,button{width:100%;font:inherit;border-radius:10px;padding:15px}input{background:#1c1c20;color:#fff;border:1px solid #4b4149}input:focus-visible{outline:2px solid #f576b5;outline-offset:3px}button{margin-top:18px;background:#f576b5;color:#181017;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.back{display:inline-block;margin-top:24px;color:#bdb5bc;font-size:14px}#error{color:#ffadc9;min-height:24px;font-size:14px}
</style></head><body><main><a class="brand" href="/">jeolee cupids</a><h1>Admin sign-in.</h1><p>Enter your password to manage the library and review Cupid contributions.</p><form id="login-form"><label for="password">Admin password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required autofocus><button id="submit" type="submit">Open admin</button><p id="error" role="alert" aria-live="polite"></p></form><a class="back" href="/">← Back to Jeolee</a></main>
<script>
const form=document.getElementById('login-form'),button=document.getElementById('submit'),error=document.getElementById('error');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;error.textContent='';try{const response=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});let data;try{data=await response.json();}catch{throw new Error('Please refresh and try again.');}if(!response.ok)throw new Error(data.error||'Sign-in failed. Please try again.');location.replace('/admin');}catch(e){error.textContent=e.message;}finally{button.disabled=false;}});
</script></body></html>
